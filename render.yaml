# Render Blueprint: creates the database and the web service from this repository.
# In Render: New + -> Blueprint -> select this repo. See docs/DEPLOYMENT.md.
databases:
  - name: agendo-db
    plan: free
    databaseName: agendo
    user: agendo

services:
  - type: web
    name: agendo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agendo-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
